name: API Automation (Playwright)

on:
  push:
    branches: [ main, development ]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Install Playwright (required even for API tests)
      - name: Install Playwright
        run: npx playwright install --with-deps

      # ❌ REMOVED: manual API server start
      # Playwright webServer handles this

      # 5️⃣ Run API automation tests
      - name: Run API tests
        run: npm run test:api

      # 6️⃣ Upload Playwright report (always)
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
